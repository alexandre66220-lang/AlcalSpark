<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Gold glow filter -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#C9A84C" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Inner gold glow -->
    <filter id="inner-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#E8C97A" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Gold gradient for line -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7530" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#C9A84C"/>
      <stop offset="70%" stop-color="#E8C97A"/>
      <stop offset="100%" stop-color="#9A7530" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Radial gradient for circle background -->
    <radialGradient id="bg-gradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1000"/>
      <stop offset="60%" stop-color="#0C0C0C"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <!-- Radial glow for border -->
    <radialGradient id="border-glow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <!-- Outer glow halo -->
  <circle cx="200" cy="200" r="196" fill="url(#border-glow)" opacity="0.6"/>

  <!-- Main circle background -->
  <circle cx="200" cy="200" r="180" fill="url(#bg-gradient)"/>

  <!-- Gold circle border with glow -->
  <circle cx="200" cy="200" r="180" stroke="#C9A84C" stroke-width="1.8" fill="none" filter="url(#gold-glow)" opacity="0.9"/>

  <!-- Subtle inner ring -->
  <circle cx="200" cy="200" r="172" stroke="#C9A84C" stroke-width="0.5" fill="none" opacity="0.2"/>

  <!-- Corner decorative dots -->
  <circle cx="200" cy="28" r="2.5" fill="#C9A84C" opacity="0.6"/>
  <circle cx="200" cy="372" r="2.5" fill="#C9A84C" opacity="0.6"/>
  <circle cx="28"  cy="200" r="2.5" fill="#C9A84C" opacity="0.6"/>
  <circle cx="372" cy="200" r="2.5" fill="#C9A84C" opacity="0.6"/>

  <!-- "ALCAL" text -->
  <text
    x="200"
    y="178"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="82"
    font-weight="700"
    fill="#FAF8F5"
    text-anchor="middle"
    letter-spacing="6"
    filter="url(#inner-glow)"
  >ALCAL</text>

  <!-- "SPARK" text in gold -->
  <text
    x="200"
    y="252"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="82"
    font-weight="700"
    fill="#C9A84C"
    text-anchor="middle"
    letter-spacing="6"
    filter="url(#gold-glow)"
  >SPARK</text>

  <!-- Separator line -->
  <line x1="80" y1="268" x2="320" y2="268" stroke="url(#gold-gradient)" stroke-width="1.5"/>

  <!-- Tagline "Web · Design · Visuels" -->
  <text
    x="200"
    y="306"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    font-weight="300"
    fill="#FAF8F5"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.65"
  >Web · Design · Visuels</text>
</svg>
