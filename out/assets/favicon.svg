<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="58%">
      <stop offset="0%"   stop-color="#181200"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F2DFA0"/>
      <stop offset="40%"  stop-color="#C9A84C"/>
      <stop offset="70%"  stop-color="#8A6820"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <filter id="gs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feFlood flood-color="#C9A84C" flood-opacity="0.6" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cl"><circle cx="50" cy="50" r="44"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#C9A84C" stroke-width="0.4" opacity="0.15"/>
  <circle cx="50" cy="50" r="46" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#ring)" stroke-width="2.5" filter="url(#gs)" opacity="0.9"/>
  <g clip-path="url(#cl)">
    <text x="44" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#FAF8F5" text-anchor="middle">A</text>
    <text x="62" y="67" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#C9A84C" text-anchor="middle" filter="url(#gs)">S</text>
  </g>
</svg>
