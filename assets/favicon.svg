<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#C9A84C" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1000"/>
      <stop offset="100%" stop-color="#0C0C0C"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15.5" fill="url(#bg)"/>
  <circle cx="16" cy="16" r="15.5" stroke="#C9A84C" stroke-width="1" fill="none" filter="url(#glow)" opacity="0.85"/>
  <text x="16" y="13" font-family="Georgia, serif" font-size="9" font-weight="700" fill="#FAF8F5" text-anchor="middle" letter-spacing="0.5">AL</text>
  <text x="16" y="22" font-family="Georgia, serif" font-size="9" font-weight="700" fill="#C9A84C" text-anchor="middle" letter-spacing="0.5" filter="url(#glow)">SP</text>
  <line x1="7" y1="24" x2="25" y2="24" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
</svg>
