<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Deep black with subtle warm highlight -->
    <radialGradient id="bg" cx="40%" cy="35%" r="58%">
      <stop offset="0%"   stop-color="#181200"/>
      <stop offset="45%"  stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#060606"/>
    </radialGradient>

    <!-- Gold ring gradient — 3-D shimmer effect -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F2DFA0"/>
      <stop offset="22%"  stop-color="#C9A84C"/>
      <stop offset="48%"  stop-color="#F0D070"/>
      <stop offset="72%"  stop-color="#8A6820"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>

    <!-- Outer gold ambient glow -->
    <filter id="glow-ring" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feFlood flood-color="#C9A84C" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gold letter glow -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#C9A84C" flood-opacity="0.65" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- White letter subtle glow -->
    <filter id="glow-white" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep shadow for depth on letters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Clip letters inside circle -->
    <clipPath id="clip">
      <circle cx="200" cy="200" r="174"/>
    </clipPath>
  </defs>

  <!-- Very faint outer halo -->
  <circle cx="200" cy="200" r="198" fill="none" stroke="#C9A84C" stroke-width="1.2" opacity="0.13"/>

  <!-- Main circle background -->
  <circle cx="200" cy="200" r="183" fill="url(#bg)"/>

  <!-- Gold border ring — premium thick stroke with shimmer -->
  <circle cx="200" cy="200" r="183" fill="none" stroke="url(#ring-grad)" stroke-width="8" filter="url(#glow-ring)" opacity="0.92"/>

  <!-- Secondary inner accent ring -->
  <circle cx="200" cy="200" r="171" fill="none" stroke="#C9A84C" stroke-width="0.7" opacity="0.2"/>

  <!-- Subtle light reflection arc (top-left) — 3D feel -->
  <path d="M 90,140 A 130,130 0 0,1 190,58" stroke="#F5E0A0" stroke-width="1.5" fill="none" opacity="0.18" stroke-linecap="round"/>

  <!-- Letters clipped to circle -->
  <g clip-path="url(#clip)">
    <!-- White serif "A" — dominant, left of center -->
    <text
      x="177"
      y="278"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="218"
      font-weight="700"
      fill="#FAF8F5"
      text-anchor="middle"
      filter="url(#shadow)"
    >A</text>

    <!-- Gold "S" — overlapping right, slightly smaller, forward layer -->
    <text
      x="244"
      y="270"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="178"
      font-weight="700"
      fill="#C9A84C"
      text-anchor="middle"
      filter="url(#glow-gold)"
    >S</text>
  </g>
</svg>
